name: Temporary branch formatter

on:
  push:
    branches:
      - feat/results-explorer-v1-v2-20261017
    paths:
      - clickstudio/**
      - .github/workflows/results-branch-formatter.yml

permissions:
  contents: write

concurrency:
  group: clickstudio-branch-autofmt
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install tools
        working-directory: clickstudio
        run: npm ci
      - name: Apply project formatter
        working-directory: clickstudio
        run: |
          npm run lint:fix || true
          npm run format
          npx stylelint "src/frontend/**/*.css" --fix || true
          npm run format:css
      - name: Push formatting to implementation branch
        run: |
          git config user.name "ClickStudio branch formatter"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clickstudio
          if ! git diff --cached --quiet; then
            git commit -m "style: apply project formatting to result exploration"
            git push origin HEAD:feat/results-explorer-v1-v2-20261017
          fi
