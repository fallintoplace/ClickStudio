name: ClickStudio validation

concurrency:
  group: clickstudio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    paths: ["clickstudio/**", "package.json", "src/index.ts", ".github/workflows/clickstudio.yml"]
  pull_request:
    paths: ["clickstudio/**", "package.json", "src/index.ts", ".github/workflows/clickstudio.yml"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: clickstudio

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and test syntax
        run: npm run check:syntax
      - name: TypeScript contracts
        run: npm run typecheck
      - name: ESLint
        run: npm run lint

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Core and workspace coverage gates
        run: npm run coverage

  production-build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build:app

  clickhouse-integration:
    name: ClickHouse integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Start ClickHouse 24.6
        id: database
        run: npm run init:env && docker compose up -d --wait clickhouse && npm run db:setup
      - name: HTTP integration and live ClickHouse checks
        run: CLICKHOUSE_INTEGRATION=1 npm run test:integration
      - name: Deterministic SQL evaluations
        run: npm run eval
      - name: Build and start the full Docker Compose app
        run: docker compose --profile app up -d --build
      - name: Check containerized app health
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 3 http://127.0.0.1:8080/api/health > /dev/null; then
              echo "ClickStudio API is healthy."
              exit 0
            fi
            sleep 2
          done
          docker compose --profile app logs --no-color --tail=100 app
          exit 1
      - name: Capture ClickHouse diagnostics
        if: ${{ failure() && steps.database.outcome != 'skipped' }}
        run: docker compose --profile app logs --no-color > clickstudio-compose.log 2>&1 || true
      - name: Preserve ClickHouse diagnostics
        if: ${{ failure() && steps.database.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: clickstudio-compose-diagnostics
          path: clickstudio/clickstudio-compose.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local services
        if: ${{ always() && steps.database.outcome != 'skipped' }}
        run: docker compose --profile app down -v

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: clickstudio/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        run: npm run test:e2e
      - name: Production preview parser and export smoke test
        run: npm run test:e2e:preview
      - name: Preserve browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: clickstudio-browser-diagnostics
          path: |
            clickstudio/playwright-report
            clickstudio/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve UX screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clickstudio-ux-screenshots
          path: clickstudio/test-results/**/clickstudio-*.png
          if-no-files-found: ignore
          retention-days: 7
