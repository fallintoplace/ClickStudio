name: clickstudio
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.6
    ports:
      - "127.0.0.1:8123:8123"
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_ADMIN_USER:-clickstudio_admin}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Run npm run init:env first}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./docker/clickstudio-reader.xml:/etc/clickhouse-server/users.d/clickstudio.xml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8123/ping | grep -q Ok"]
      interval: 5s
      timeout: 3s
      retries: 20
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
  setup:
    build: .
    profiles: [app]
    command: ["node", "--import", "tsx", "scripts/seed.ts"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_ADMIN_USER: ${CLICKHOUSE_ADMIN_USER:-clickstudio_admin}
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Run npm run init:env first}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Reader password is required}
      CLICKHOUSE_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:?Writer password is required}
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    profiles: [app]
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      APP_ORIGIN: http://localhost:8080
      CLICKSTUDIO_TOKEN: ${CLICKSTUDIO_TOKEN:?Run npm run init:env first}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: default
      CLICKHOUSE_USER: clickstudio_reader
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Reader password is required}
      CLICKHOUSE_WRITER_USER: clickstudio_writer
      CLICKHOUSE_WRITER_PASSWORD: ${CLICKHOUSE_WRITER_PASSWORD:?Writer password is required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    volumes:
      - clickstudio-data:/app/.data
    depends_on:
      setup:
        condition: service_completed_successfully
    stop_grace_period: 15s
volumes:
  clickhouse-data:
  clickstudio-data:
